<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Import Workflow Kanban</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-slate-100 text-slate-900">
    <header class="border-b border-slate-200 bg-white px-6 py-4 shadow-sm">
      <h1 class="text-2xl font-semibold tracking-tight">BOH Import Team</h1>
      <p class="mt-1 text-sm text-slate-600">Drag cards between columns to update status. Click a card to edit details in a modal popup.</p>
    </header>

    <main class="p-4">
      <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm" aria-label="Kanban board">
        <div class="flex items-center justify-between border-b border-slate-200 p-4">
          <h2 class="text-xl font-semibold">Board</h2>
          <button type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50">View as backlog</button>
        </div>
        <div id="kanban-board" class="grid min-w-[1250px] grid-cols-5 gap-3 overflow-x-auto p-3"></div>
      </section>
    </main>

    <div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div id="modal-overlay" class="absolute inset-0 bg-slate-900/60"></div>
      <div class="relative z-10 max-h-[90vh] w-full max-w-5xl overflow-y-auto rounded-xl bg-white shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
          <h3 class="text-lg font-semibold">Edit Card Details</h3>
          <button id="close-modal" type="button" class="rounded-md border border-slate-300 px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100">Close</button>
        </div>

        <form id="details-form" class="space-y-6 p-5">
          <section>
            <h4 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500">Card</h4>
            <div class="grid gap-3 md:grid-cols-2">
              <label class="field-label">Reference <input id="field-ref" class="field-input" required /></label>
              <label class="field-label">Owner <input id="field-owner" class="field-input" required /></label>
              <label class="field-label">Customer <input id="field-customer" class="field-input" required /></label>
              <label class="field-label">MRN / Date <input id="field-mrn" class="field-input" required /></label>
              <label class="field-label md:col-span-2">Tags (comma-separated) <input id="field-tags" class="field-input" /></label>
            </div>
          </section>

          <section>
            <h4 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500">Invoice Details</h4>
            <div id="invoice-fields" class="grid gap-3 md:grid-cols-2"></div>
          </section>

          <section>
            <h4 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500">Worksheet Values</h4>
            <div id="worksheet-values-fields" class="grid gap-3 md:grid-cols-2"></div>
          </section>

          <section>
            <h4 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500">Entry Values</h4>
            <div id="entry-values-fields" class="grid gap-3 md:grid-cols-2"></div>
          </section>

          <section>
            <h4 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500">Worksheet Lines</h4>
            <div id="worksheet-lines-fields" class="grid gap-3 md:grid-cols-2"></div>
          </section>

          <section>
            <h4 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500">Entry Lines</h4>
            <div id="entry-lines-fields" class="grid gap-3 md:grid-cols-2"></div>
          </section>

          <div class="flex justify-end gap-3 border-t border-slate-200 pt-4">
            <button id="cancel-modal" type="button" class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button>
            <button type="submit" class="rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">Save changes</button>
          </div>
        </form>
      </div>
    </div>

    <template id="card-template">
      <article class="kanban-card rounded-lg border border-slate-200 bg-white p-3 shadow-sm transition hover:shadow-md" draggable="true">
        <p class="work-id text-sm font-semibold text-slate-900"></p>
        <h4 class="work-ref mt-1 text-base font-semibold text-slate-800"></h4>
        <p class="work-owner mt-2 text-sm text-slate-700"></p>
        <p class="work-customer mt-1 text-sm text-slate-700"></p>
        <p class="work-mrn mt-1 text-sm text-slate-700"></p>
        <div class="tags mt-2 flex flex-wrap gap-2"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
